input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Parsear tentativas de autenticação
  grok {
    match => {
      "message" => "Authentication attempt from %{IP:source.ip} with user %{DATA:user.name}"
    }
    add_tag => ["parsed_auth_attempt"]
  }
  
  # Parsear falhas de SSH
  grok {
    match => {
      "message" => "Failed password for %{DATA:user.name} from %{IP:source.ip} port %{NUMBER:port} ssh2"
    }
    add_tag => ["parsed_ssh_failure"]
  }
  
  # Parsear sucessos de SSH
  grok {
    match => {
      "message" => "Accepted password for %{DATA:user.name} from %{IP:source.ip} port %{NUMBER:port} ssh2"
    }
    add_tag => ["parsed_ssh_success"]
  }
  
  # Parsear sudo
  grok {
    match => {
      "message" => "sudo: %{DATA:user.name} : TTY=pts/%{NUMBER:tty} ; PWD=%{DATA:pwd} ; USER=%{DATA:target_user} ; COMMAND=%{GREEDYDATA:command}"
    }
    add_tag => ["parsed_sudo"]
  }
  
  # Parsear conexões
  grok {
    match => {
      "message" => "Connection from %{IP:source.ip} port %{NUMBER:source_port} to port %{NUMBER:destination_port}"
    }
    add_tag => ["parsed_connection"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logstash-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
